name: Bug report
description: Tell us about something that did not work as expected in TT Clip.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve TT Clip. Do not paste clipboard contents, file paths, access tokens, private data, or unredacted screenshots.
  - type: input
    id: version
    attributes:
      label: TT Clip version
      placeholder: "For example: 0.1.29 (31)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac model
      placeholder: "For example: macOS 26.0, MacBook Pro (Apple silicon)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sidebar
        - Clipboard capture
        - Drag and drop
        - Preview or OCR
        - Search, code, or links
        - Permissions or shortcuts
        - Installation or update
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Copy or drag ...
        3. Choose ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed clipboard content, personal data, credentials, private paths, and unredacted screenshots.
          required: true
